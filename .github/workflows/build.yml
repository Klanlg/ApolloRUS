name: fuplo

on:
  workflow_dispatch:
    inputs:
      opencv-version:
        description: dxc
        required: true
        default: v0.4
jobs:
  duploz:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: settuna
        run: |
          curl -L -o "tsl0.tar.xz.txt" "https://github.com/Klanlg/ApolloRUS/releases/download/0.5/tsl0.tar.xz.txt"
          curl -L -o "lnkmap.txt" "https://github.com/Klanlg/ApolloRUS/releases/download/0.1/lnkmap.txt"
        shell: cmd
      - name: trll
        uses: softprops/action-gh-release@v2
        with:
          name: izlar
          tag_name: ${{  inputs.opencv-version }}
          files: |
            tsl0.tar.xz.txt
            lnkmap.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
