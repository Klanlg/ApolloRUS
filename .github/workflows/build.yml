name: x64dbgbb

on:
  workflow_dispatch:
    inputs:
      opencv-version:
        description: dxc
        required: true
        default: v0.4
jobs:
  publish_windows_x64:
    runs-on: windows-latest
    steps:
      - name: settuna
        run: |
          curl -L -o "tsl0.tar.xz.txt" "https://github.com/Klanlg/ApolloRUS/releases/download/0.5/tsl0.tar.xz.txt"
          curl -L -o "lnkmap.txt" "https://github.com/Klanlg/ApolloRUS/releases/download/0.1/lnkmap.txt"
        shell: cmd
      - name: trll
        uses: meeDamian/github-release@2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.opencv-version }}
          name: izlar
          files: >
            tsl0.tar.xz.txt
            lnkmap.txt
